name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build Archive
        run: |
          # Автоматическое определение названия схемы проекта
          SCHEME=$(xcodebuild -list -project TgWsProxy.xcodeproj | awk '/Schemes:/{flag=1; next} /^$/{flag=0} flag' | head -n 1 | xargs)
          echo "Using scheme: $SCHEME"

          xcodebuild archive \
            -project TgWsProxy.xcodeproj \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Export Payload (.ipa)
        run: |
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/*.app Payload/
          zip -r tg-ws-proxy.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tg-ws-proxy-ipa
          path: tg-ws-proxy.ipa
