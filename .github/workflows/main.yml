name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install Rust Target
        run: rustup target add aarch64-apple-ios

      - name: Build Archive
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          xcodebuild archive \
            -project TgWsProxy.xcodeproj \
            -scheme "TgWsProxy" \
            -sdk iphoneos \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ACTUALLY_ENABLED=NO

      - name: Export Payload (.ipa)
        run: |
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/*.app Payload/
          zip -r tg-ws-proxy.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tg-ws-proxy-ipa
          path: tg-ws-proxy.ipa
